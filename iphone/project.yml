name: SoniCinemas
options:
  bundleIdPrefix: com.movieapp
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
targets:
  SoniCinemas:
    type: application
    platform: iOS
    sources:
      - path: SoniCinemas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.movieapp.sonicinemas
        INFOPLIST_FILE: SoniCinemas/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
