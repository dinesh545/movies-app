name: SoniCinemas
options:
  bundleIdPrefix: com.movieapp
  deploymentTarget:
    iOS: "15.0"
targets:
  SoniCinemas:
    type: application
    platform: iOS
    sources:
      - path: SoniCinemas
    info:
      path: SoniCinemas/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.movieapp.sonicinemas
      INFOPLIST_FILE: SoniCinemas/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
