name: Build iOS IPA for iPhone 15

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_16=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_16" ]; then
            echo "Selecting $XCODE_16"
            sudo xcode-select -s "$XCODE_16/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd iphone
          xcodegen generate

      - name: Create Unsigned IPA via Archive
        run: |
          cd iphone
          mkdir -p Payload
          xcodebuild archive \
            -project SoniCinemas.xcodeproj \
            -scheme SoniCinemas \
            -archivePath ./build/SoniCinemas.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          cp -r ./build/SoniCinemas.xcarchive/Products/Applications/SoniCinemas.app Payload/
          zip -r SoniCinemas.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoniCinemas-iPhone15
          path: iphone/SoniCinemas.ipa
