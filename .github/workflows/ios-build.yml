name: Build iOS IPA for iPhone 15

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd iphone
          xcodegen generate

      - name: Create Unsigned IPA
        run: |
          cd iphone
          mkdir -p Payload
          xcodebuild -project SoniCinemas.xcodeproj -scheme SoniCinemas -sdk iphoneos -configuration Release -derivedDataPath ./build CODE_SIGN_STYLE="Manual" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build || xcodebuild -project SoniCinemas.xcodeproj -scheme SoniCinemas -sdk iphonesimulator -configuration Release -derivedDataPath ./build CODE_SIGN_STYLE="Manual" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build
          APP_PATH=$(find ./build/Build/Products/ -name "SoniCinemas.app" | head -n 1)
          echo "App path found: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r SoniCinemas.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoniCinemas-iPhone15
          path: iphone/SoniCinemas.ipa
