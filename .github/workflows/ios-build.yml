name: Build iOS IPA for iPhone 15

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd iphone
          xcodegen generate

      - name: Create Unsigned IPA
        run: |
          cd iphone
          mkdir -p Payload
          xcodebuild -project SoniCinemas.xcodeproj -scheme SoniCinemas -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build derivedDataPath ./build
          cp -r ./build/Build/Products/Release-iphoneos/SoniCinemas.app Payload/
          zip -r SoniCinemas.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoniCinemas-iPhone15
          path: iphone/SoniCinemas.ipa
